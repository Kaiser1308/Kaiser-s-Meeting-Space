packages:
  - apps/*
  - packages/*

# Resolve outside the workspace so native package paths do not inherit the
# workspace's long Windows path. The relative location is portable across
# machines and does not encode a user profile or drive letter.
virtualStoreDir: ../../../../../q3
nodeLinker: isolated
packageImportMethod: copy
storeDir: ../../../../../pnpm-store

allowBuilds:
  better-sqlite3: true
  cpu-features: true
  electron: true
  esbuild: true
  keytar: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true

onlyBuiltDependencies:
  - esbuild
  - electron
  - better-sqlite3
  - keytar

packageExtensions:
  vite-plugin-electron:
    dependencies:
      vite: '*'
    peerDependencies:
      vite: '*'
